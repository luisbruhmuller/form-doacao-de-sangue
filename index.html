<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doação de Sangue</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="formulario">
        <h2>Cadastro de Doadores</h2>
        <form id="formsangue">
            <label for="nome">Nome completo:</label>
            <input id="nome" type="text" name="nome" placeholder="Ex: João da Silva" required>
    
            <label for="email">Email:</label>
            <input id="email" type="email" name="email" placeholder="exemplo@exemplo.com" required>
    
            <label for="telefone">Telefone (apenas números):</label>
            <input id="telefone" type="text" name="telefone" placeholder="11999999999" required>
    
            <label for="idade">Idade:</label>
            <input id="idade" type="number" name="idade" placeholder="Ex: 25" required>
    
            <label for="peso">Peso (kg):</label>
            <input id="peso" type="number" name="peso" placeholder="Ex: 70" required>

            <label for="tipo">Tipo Sanguíneo:</label>
            <select id="tipo" name="tipo" required>
                <option value="">Selecione...</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
            </select>

            <label for="cidade">Cidade:</label>
            <input id="cidade" type="text" name="cidade" placeholder="Ex: São Paulo" required>
    
            <label for="estado">Estado:</label>
            <input id="estado" type="text" name="estado" placeholder="Ex: SP" required>

            <button type="submit" id="enviar">
                Cadastrar
            </button>
        </form>
        
        <div id="lista-doadores"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
