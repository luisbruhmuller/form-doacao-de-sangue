<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doação de Sangue - Seja um Herói</title>
    <!-- Fonte moderna do Google -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-overlay"></div>
    
    <div id="formulario">
        <div class="header">
            <div class="icon">❤️</div>
            <h2>Cadastro de Doadores</h2>
            <p>Sua doação pode salvar até 4 vidas.</p>
        </div>

        <form id="formsangue">
            <div class="input-group">
                <label for="nome">Nome completo</label>
                <input id="nome" type="text" name="nome" placeholder="Ex: João da Silva" required>
            </div>
    
            <div class="row">
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input id="email" type="email" name="email" placeholder="email@exemplo.com" required>
                </div>
                <div class="input-group">
                    <label for="telefone">Telefone</label>
                    <input id="telefone" type="text" name="telefone" placeholder="Apenas números" required>
                </div>
            </div>
    
            <div class="row">
                <div class="input-group">
                    <label for="idade">Idade</label>
                    <input id="idade" type="number" name="idade" placeholder="Anos" required>
                </div>
                <div class="input-group">
                    <label for="peso">Peso (kg)</label>
                    <input id="peso" type="number" name="peso" placeholder="Ex: 70" required>
                </div>
                <div class="input-group">
                    <label for="tipo">Tipo Sanguíneo</label>
                    <select id="tipo" name="tipo" required>
                        <option value="">Escolha...</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="input-group">
                    <label for="cidade">Cidade</label>
                    <input id="cidade" type="text" name="cidade" placeholder="Sua cidade" required>
                </div>
                <div class="input-group">
                    <label for="estado">Estado</label>
                    <input id="estado" type="text" name="estado" placeholder="UF" required>
                </div>
            </div>

            <button type="submit" id="enviar">
                Confirmar Cadastro
            </button>
        </form>
        
        <div id="lista-doadores"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
